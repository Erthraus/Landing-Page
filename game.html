<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ERTHRAUS | Career Simulation</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" type="image/png" href="assets/pp.png" />

    <!-- SEO -->
    <meta
      name="description"
      content="Interactive career timeline of Mustafa Kemal Öz (ERTHRAUS) – walk through his journey from university to XR development."
    />
    <meta name="author" content="Mustafa Kemal Öz" />
    <meta name="robots" content="noindex" />

    <!-- Open Graph -->
    <meta property="og:title" content="ERTHRAUS | Career Simulation" />
    <meta
      property="og:description"
      content="Walk through Mustafa Kemal Öz's career milestones in an interactive side-scrolling simulation."
    />
    <meta property="og:url" content="https://erthraus.dev/game.html" />
    <meta property="og:image" content="https://erthraus.dev/assets/pp.png" />

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src https://terminal-loggert.ozmustafakemal.workers.dev;"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="src/style.css" />

    <style>
      body {
        overflow: hidden;
        touch-action: none;
        user-select: none;
        background-color: #000;
        font-family: "VT323", monospace;
      }

      #matrix-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        opacity: 0.3; /* DIMMED so game is visible */
      }

      #game-viewport {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        z-index: 5;
      }

      #gameCanvas {
        display: block;
        width: 100%;
        height: 100%;
        /* Transparent so Matrix shows through */
        background: transparent;
      }

      /* UI Layer */
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        padding: 20px;
      }

      /* info-box removed — milestone info is rendered in-canvas */

      .controls-hint {
        position: absolute;
        bottom: 50px;
        width: 100%;
        text-align: center;
        color: white;
        text-shadow: 0 0 5px black;
        font-size: 1.5rem;
        animation: pulse-text 2s infinite;
      }

      @keyframes pulse-text {
        0% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.5;
        }
      }

      #mobile-controls {
        display: none;
        pointer-events: auto;
      }
      @media (max-width: 768px) {
        #mobile-controls {
          display: flex;
          position: absolute;
          bottom: 20px;
          width: 100%;
          justify-content: space-between;
          padding: 0 40px;
        }
        .ctrl-btn {
          width: 60px;
          height: 60px;
          background: rgba(0, 255, 65, 0.2);
          border: 2px solid var(--matrix-green);
          border-radius: 50%;
          color: white;
          font-size: 24px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .ctrl-btn:active {
          background: var(--matrix-green);
          color: black;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="matrix-canvas"></canvas>

    <div id="game-viewport">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div id="ui-layer">
      <div class="flex justify-between items-start pointer-events-auto">
        <a
          href="portfolio.html"
          class="border border-green-500 bg-black text-green-500 px-4 py-2 hover:bg-green-500 hover:text-black transition uppercase font-bold text-xl"
        >
          <i class="fas fa-terminal"></i> Terminal
        </a>
        <div class="text-right">
          <div class="text-3xl font-bold text-white mb-1">CAREER_SIM_v3.0</div>
          <div class="text-xl text-green-400">
            Skills Acquired:
            <span id="skills-ui" class="text-white font-bold">0</span>
          </div>
          <div class="text-xl text-green-400">
            Distance:
            <span id="dist-counter" class="text-white font-bold">0</span>m
          </div>
        </div>
      </div>

      <div class="controls-hint" id="hint-text">
        [A/D] or [ARROWS] to Walk · [W/SPACE] to Jump · [S/DOWN] to Drop ·
        Stomp Bugs!
      </div>

      <div id="mobile-controls">
        <button class="ctrl-btn" id="btn-left">
          <i class="fas fa-arrow-left"></i>
        </button>
        <button class="ctrl-btn" id="btn-up">
          <i class="fas fa-arrow-up"></i>
        </button>
        <button class="ctrl-btn" id="btn-right">
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <script src="src/matrix.js"></script>
    <script src="src/game.js"></script>
  </body>
</html>
